apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-api-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins-api-poc
  template:
    metadata:
      labels:
        app: jenkins-api-poc
    spec:
      containers:
        - name: jenkins-api-poc
          image: registry.hub.docker.com/budiholan/jenkins-api-poc:<TheTag>
          imagePullPolicy: "IfNotPresent"
          ports:
            - containerPort: 8080
#          resources:
#            requests:
#              memory: 400Mi
#            limits:
#              memory: 600Mi
#              cpu: 500m
      restartPolicy: Always
      imagePullSecrets:
        - name: jenkins-rancher

---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-api-poc
spec:
  type: NodePort
  selector:
    app: jenkins-api-poc
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
