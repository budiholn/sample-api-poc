apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-api-poc
  template:
    metadata:
      labels:
        app: sample-api-poc
    spec:
      containers:
        - name: sample-api-poc
          image: budiholan/sample-api-poc:0.0.1
          imagePullPolicy: "IfNotPresent"
          ports:
            - containerPort: 8080
#          resources:
#            requests:
#              memory: 400Mi
#            limits:
#              memory: 600Mi
#              cpu: 500m
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: sample-api-poc
spec:
  type: NodePort
  selector:
    app: sample-api-poc
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080